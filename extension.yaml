{
  "manifest_version": 2,
  "extension_id": "flowsteward.bigquery",
  "kind": "tool_provider",
  "version": "1.1.4",
  "release_stage": "active",
  "display_name": "BigQuery",
  "description": "Read BigQuery datasets with scoped saved SQL; preserve parameterized SELECT, INSERT, UPDATE, DELETE and MERGE workflow actions.",
  "lifecycle": {
    "data_schema_version": 1,
    "data_migrations": []
  },
  "vendor": {
    "name": "Flow Steward"
  },
  "listing": {
    "category": "data",
    "tags": [
      "bigquery",
      "toolbox"
    ],
    "summary": "SQL datasets and saved queries; read, insert, update, delete and merge workflow data."
  },
  "features": [
    "tool",
    "action",
    "query",
    "dataset_connector"
  ],
  "required_scopes": [
    "extension:invoke"
  ],
  "egress": {
    "hosts": [
      "bigquery.googleapis.com",
      "oauth2.googleapis.com",
      "www.googleapis.com"
    ]
  },
  "account_scope": {
    "scope_type": "project",
    "description": "Explicit project-scoped BigQuery connections."
  },
  "entrypoint": {
    "mode": "subprocess",
    "command": [
      "python3",
      "main.py"
    ],
    "timeout_seconds": 40
  },
  "health": {
    "command": [
      "python3",
      "health.py"
    ],
    "timeout_seconds": 5
  },
  "ui_manifest": "ui/ui_manifest.yaml",
  "action_manifest": "ui/actions/actions.yaml",
  "python_requirements": [],
  "runtime": {
    "contract_version": "extension_host_v2",
    "compatibility": {
      "platform_min": "1.5.0"
    },
    "extension_contract_v2": {
      "connection_types": "contracts/connection_types.yaml",
      "operation_manifest": "contracts/operation_manifest.yaml",
      "step_ui_manifest": "contracts/step_ui_manifest.yaml",
      "dataset_connectors": [
        {
          "connector_id": "bigquery",
          "connector_type_id": "bigquery",
          "database_kind": "bigquery",
          "display_name": "BigQuery",
          "description": "Read-only saved SQL and bounded schema inspection for allowed native BigQuery tables.",
          "source_kind": "bigquery",
          "source_extension_id": "flowsteward.bigquery",
          "source_extension_name": "BigQuery",
          "source_provider": "BigQuery",
          "query_language": "sql",
          "access_mode": "read_only",
          "runtime_kind": "local_extension",
          "runtime_adapter_ref": "main.py",
          "connection_schema": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "project",
              "location",
              "allowed_datasets"
            ],
            "properties": {
              "project": {
                "type": "string",
                "minLength": 6,
                "maxLength": 63
              },
              "location": {
                "type": "string",
                "minLength": 1,
                "maxLength": 64
              },
              "allowed_datasets": {
                "type": "array",
                "minItems": 1,
                "maxItems": 32,
                "items": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 1024
                }
              },
              "maximum_bytes_billed": {
                "type": "integer",
                "minimum": 1,
                "maximum": 1000000000000,
                "default": 10485760
              },
              "request_timeout_seconds": {
                "type": "integer",
                "minimum": 1,
                "maximum": 30,
                "default": 20
              }
            }
          },
          "secret_schema": {
            "type": "object",
            "additionalProperties": false,
            "properties": {
              "service_account_json": {
                "type": "string",
                "maxLength": 65536,
                "title": "Service account JSON (matching Google project)"
              },
              "access_token": {
                "type": "string",
                "maxLength": 16384,
                "title": "Short-lived Google OAuth access token"
              }
            }
          },
          "capabilities": {
            "read_only": true,
            "test_connection": true,
            "schema_introspection": true,
            "validate_query": true,
            "preview_query": true,
            "execute_template": true,
            "infer_output_schema": true,
            "row_preview": true,
            "write_queries": false
          },
          "safety_profile": {
            "access_mode": "read_only",
            "indexes_rows": false,
            "executes_write_queries": false,
            "requires_saved_template": true
          },
          "preview_support": true,
          "schema_refresh_support": true
        }
      ],
      "resource_query_manifest": [
        {
          "query_id": "runtime_health",
          "cursor_mode": "none",
          "required_scopes": [
            "extension:invoke"
          ],
          "description": "Verify the packaged native runtime is available.",
          "result_fields": [
            "result.status",
            "result.extension_id"
          ],
          "error_codes": [
            "unknown_query",
            "native_unavailable"
          ]
        },
        {
          "query_id": "supported_connectors",
          "cursor_mode": "none",
          "required_scopes": [
            "extension:invoke"
          ],
          "description": "Return the executable SQL dataset connector catalog.",
          "result_fields": [
            "result.connectors"
          ],
          "error_codes": [
            "unknown_query",
            "native_unavailable"
          ]
        }
      ]
    }
  },
  "external_effects": [
    {
      "operation_id": "write",
      "effect_kind": "database_write",
      "channel": "bigquery",
      "idempotency": "required",
      "test_mode_behavior": "suppress"
    }
  ],
  "machine_auth": {
    "service_account_key": "svc_ext_bigquery",
    "required_scopes": [
      "extension:invoke"
    ]
  }
}
