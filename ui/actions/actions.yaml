{
  "actions": [
    {
      "action_id": "query",
      "workflow_visible": true,
      "title": "Read rows (SELECT)",
      "description": "Run one bounded SELECT against allowed native tables. Up to 100 rows; truncated results require explicit follow-up.",
      "required_scopes": [
        "extension:invoke"
      ],
      "handler": {
        "mode": "extension"
      },
      "parameters": [
        {
          "name": "connection_ref",
          "type": "string",
          "required": true
        },
        {
          "name": "statement",
          "type": "string",
          "required": true
        },
        {
          "name": "parameters",
          "type": "array",
          "required": false
        }
      ],
      "result_fields": [
        "result.rows",
        "result.job_id",
        "result.project",
        "result.location",
        "result.statement_type",
        "result.total_rows",
        "result.truncated",
        "result.affected_rows",
        "result.bytes_processed",
        "result.bytes_billed"
      ],
      "error_codes": [
        "invalid_payload",
        "invalid_connection",
        "unknown_action",
        "effect_claim_required",
        "test_mode_suppressed",
        "authentication_failed",
        "provider_unavailable",
        "native_unavailable",
        "invalid_provider_response",
        "response_too_large",
        "timeout"
      ],
      "mutates_platform": false
    },
    {
      "action_id": "write",
      "workflow_visible": true,
      "title": "Write rows (INSERT, UPDATE, DELETE, MERGE)",
      "description": "Run one INSERT, UPDATE, DELETE or MERGE. Durable effect claim required; writes are suppressed in test mode. On uncertain outcome inspect the returned job ID before any manual retry.",
      "required_scopes": [
        "extension:invoke"
      ],
      "handler": {
        "mode": "extension"
      },
      "parameters": [
        {
          "name": "connection_ref",
          "type": "string",
          "required": true
        },
        {
          "name": "statement",
          "type": "string",
          "required": true
        },
        {
          "name": "parameters",
          "type": "array",
          "required": false
        }
      ],
      "result_fields": [
        "result.rows",
        "result.job_id",
        "result.project",
        "result.location",
        "result.statement_type",
        "result.total_rows",
        "result.truncated",
        "result.affected_rows",
        "result.bytes_processed",
        "result.bytes_billed"
      ],
      "error_codes": [
        "invalid_payload",
        "invalid_connection",
        "unknown_action",
        "effect_claim_required",
        "test_mode_suppressed",
        "authentication_failed",
        "provider_unavailable",
