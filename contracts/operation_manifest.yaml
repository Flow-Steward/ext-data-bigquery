{
  "operations": [
    {
      "operation_id": "query",
      "display_name": "BigQuery: Read rows with a SELECT query",
      "description": "Read up to 100 rows from one bounded SELECT, for example approved orders for a later workflow step. Select a BigQuery connection whose project, location and allowed datasets include the target table; use credentials with query and data access. Example SQL: SELECT order_id, status FROM `demo-project.ops.orders` WHERE status = @status LIMIT 10. Use typed @named parameters and fully qualified backticked table names. The action does not modify database rows.",
      "operation_kind": "action",
      "workflow_visible": true,
      "connection_type_ids": [
        "bigquery"
      ],
      "category": "data",
      "inputs": [
        {
          "name": "connection_ref",
          "value_type": "connection_ref",
          "required": true,
          "display_name": "BigQuery project connection",
          "description": "Select a BigQuery connection whose project, location and allowed datasets include the target table; use credentials with query and data access."
        },
        {
          "name": "statement",
          "value_type": "text",
          "required": true,
          "display_name": "SELECT query",
          "schema": {
            "type": "string",
            "minLength": 1,
            "maxLength": 65536
          },
          "description": "Enter one bounded SELECT. Example: SELECT order_id, status FROM `demo-project.ops.orders` WHERE status = @status LIMIT 10"
        },
        {
          "name": "parameters",
          "value_type": "json",
          "required": false,
          "display_name": "Named typed parameters (JSON array)",
          "schema": {
            "type": "array",
            "maxItems": 32,
            "items": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "name",
                "type",
                "value"
              ],
              "properties": {
                "name": {
                  "type": "string",
                  "pattern": "^[A-Za-z_][A-Za-z0-9_]{0,63}$"
                },
                "type": {
                  "type": "string",
                  "enum": [
                    "STRING",
                    "INT64",
                    "FLOAT64",
                    "BOOL"
                  ]
                },
                "value": {}
              }
            }
          },
          "description": "Match every @name with one object containing name (without @), type and value. Supported types: STRING, INT64, FLOAT64, BOOL. Example: [{\"name\":\"status\",\"type\":\"STRING\",\"value\":\"approved\"}]"
        }
      ],
      "outputs": [
        {
          "name": "rows",
          "value_type": "json"
        },
        {
          "name": "job_id",
          "value_type": "text"
        },
        {
          "name": "project",
          "value_type": "text"
        },
        {
          "name": "location",
          "value_type": "text"
        },
        {
          "name": "statement_type",
          "value_type": "text"
        },
        {
          "name": "total_rows",
          "value_type": "integer"
        },
        {
          "name": "truncated",
          "value_type": "boolean"
        },
        {
          "name": "affected_rows",
          "value_type": "integer"
        },
        {
          "name": "bytes_processed",
          "value_type": "integer"
        },
        {
          "name": "bytes_billed",
          "value_type": "integer"
        }
      ],
      "result_fields": [
        "result.rows",
        "result.job_id",
        "result.project",
        "result.location",
        "result.statement_type",
        "result.total_rows",
        "result.truncated",
        "result.affected_rows",
        "result.bytes_processed",
        "result.bytes_billed"
      ],
      "error_codes": [
        "invalid_payload",
        "invalid_connection",
        "unknown_action",
        "effect_claim_required",
        "test_mode_suppressed",
        "authentication_failed",
        "provider_unavailable",
        "native_unavailable",
        "invalid_provider_response",
        "response_too_large",
        "timeout"
      ]
    },
