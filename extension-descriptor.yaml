{
  "schema_version": "extension_descriptor_v1",
  "lifecycle": {
    "data_schema_version": 1,
    "data_migrations": []
  },
  "extension_id": "flowsteward.bigquery",
  "release_version": "1.1.8",
  "extension_type": "service_extension",
  "identity": {
    "display_name": "BigQuery",
    "description": "Bring BigQuery table data into Flow Steward for reporting, record lookup and workflow-driven data changes. Read-only Datasets support table and column discovery, saved SQL with named parameters, validation, previews, execution and output-schema inference. Separate workflow actions run one GoogleSQL SELECT or one INSERT, UPDATE, DELETE or MERGE, returning job identity and available row-count and processing metadata. Use query results in later workflow steps, or write calculated and collected data back to native BigQuery tables.\n\nThe connection selects one Google Cloud project, location and allowed datasets. Queries use ordinary native tables with fully qualified identifiers. Set a per-query bytes-billed ceiling to control each query's maximum billing exposure; this is not an account-wide spending limit. Authenticate using a matching service-account JSON key or a short-lived access token.\n\nDataset SQL reads one table with explicit columns, filters, ordering and a limit, without joins, functions or subqueries. The separate workflow query action accepts a broader supported GoogleSQL subset. Reads return at most 100 rows. Views, external tables, DDL, scripts and load/export jobs are outside this connector. Parameters support scalar strings, booleans and numbers.",
    "tags": [
      "bigquery",
      "toolbox"
    ]
  },
  "vendor": {
    "vendor_name": "Flow Steward"
  },
  "listing": {
    "visibility": "public_reference",
    "category": "data"
  },
  "distribution": {
    "channel": "private_byo",
    "execution_modes": [
      "local"
    ],
    "allows_self_hosted": true,
    "requires_connected_control_plane": false,
    "import_sources": [
      "file"
    ]
  },
  "runtime": {
    "contract_version": "extension_host_v2",
    "compatibility": {
      "platform_min": "1.5.0"
    },
    "extension_contract_v2": {
      "connection_types": "contracts/connection_types.yaml",
      "operation_manifest": "contracts/operation_manifest.yaml",
      "step_ui_manifest": "contracts/step_ui_manifest.yaml",
      "dataset_connectors": [
        {
          "connector_id": "bigquery",
          "connector_type_id": "bigquery",
          "database_kind": "bigquery",
          "display_name": "BigQuery",
          "description": "Read-only saved SQL and bounded schema inspection for allowed native BigQuery tables.",
          "source_kind": "bigquery",
          "source_extension_id": "flowsteward.bigquery",
          "source_extension_name": "BigQuery",
          "source_provider": "BigQuery",
          "query_language": "sql",
          "access_mode": "read_only",
          "runtime_kind": "local_extension",
          "runtime_adapter_ref": "main.py",
          "connection_schema": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "project",
              "location",
              "allowed_datasets"
            ],
            "properties": {
              "project": {
                "type": "string",
                "minLength": 6,
                "maxLength": 63
              },
              "location": {
                "type": "string",
                "minLength": 1,
                "maxLength": 64
              },
              "allowed_datasets": {
                "type": "array",
                "minItems": 1,
                "maxItems": 32,
                "items": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 1024
                }
              },
              "maximum_bytes_billed": {
                "type": "integer",
                "minimum": 1,
                "maximum": 1000000000000,
                "default": 10485760
              },
              "request_timeout_seconds": {
                "type": "integer",
                "minimum": 1,
                "maximum": 30,
                "default": 20
              }
            }
          },
          "secret_schema": {
            "type": "object",
            "additionalProperties": false,
            "properties": {
              "service_account_json": {
                "type": "string",
                "maxLength": 65536,
                "title": "Service account JSON (matching Google project)"
              },
              "access_token": {
                "type": "string",
                "maxLength": 16384,
                "title": "Short-lived Google OAuth access token"
              }
            }
          },
          "capabilities": {
            "read_only": true,
            "test_connection": true,
            "schema_introspection": true,
            "validate_query": true,
            "preview_query": true,
            "execute_template": true,
            "infer_output_schema": true,
            "row_preview": true,
            "write_queries": false
          },
          "safety_profile": {
            "access_mode": "read_only",
            "indexes_rows": false,
            "executes_write_queries": false,
            "requires_saved_template": true
          },
          "preview_support": true,
          "schema_refresh_support": true
        }
      ],
      "resource_query_manifest": [
        {
          "query_id": "runtime_health",
          "cursor_mode": "none",
          "required_scopes": [
            "extension:invoke"
          ],
          "description": "Verify the packaged native runtime is available.",
          "result_fields": [
            "result.status",
            "result.extension_id"
          ],
          "error_codes": [
            "unknown_query",
            "native_unavailable"
          ]
        },
        {
          "query_id": "supported_connectors",
          "cursor_mode": "none",
          "required_scopes": [
            "extension:invoke"
          ],
          "description": "Return the executable SQL dataset connector catalog.",
          "result_fields": [
            "result.connectors"
          ],
          "error_codes": [
            "unknown_query",
            "native_unavailable"
          ]
        }
      ]
    }
  }
}
